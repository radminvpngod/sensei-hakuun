<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Sensei</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI",system-ui,sans-serif;user-select:none}
#stage{position:absolute;left:0;top:0;width:460px;height:460px;will-change:transform;contain:strict}
canvas{position:absolute;left:0;top:0;width:460px;height:460px;pointer-events:none}
#bubble{position:absolute;left:20px;right:20px;bottom:250px;padding:12px 16px;border-radius:14px;background:rgba(247,240,222,.96);color:#2b2420;font-family:"Yu Mincho","MS Mincho",Georgia,serif;font-size:15px;line-height:1.5;
 box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s;pointer-events:none;max-height:190px;overflow:hidden}
#bubble.show{opacity:1;transform:none}
#bubble b{display:block;font-size:10.5px;letter-spacing:.2em;color:#c8452f;margin-bottom:3px;font-family:"Segoe UI",sans-serif}
#bubble .bar{height:3px;border-radius:2px;background:rgba(43,36,32,.12);margin-top:8px;overflow:hidden;display:none}
#bubble .bar i{display:block;height:100%;width:0;background:#c8452f;transition:width .3s}
#ring{position:absolute;left:230px;top:300px;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:2px solid rgba(200,240,255,0);pointer-events:none;transition:border-color .3s}
#ring.on{border-color:rgba(200,240,255,.85);animation:ring 1.2s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.08);border-color:rgba(255,120,90,.8)}}
#menu{position:absolute;left:230px;top:300px;width:0;height:0}
.mbtn{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(20,18,30,.85);color:#f4ecd8;display:grid;place-items:center;text-align:center;
 font-size:19px;line-height:1;cursor:pointer;opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s;border:1px solid rgba(255,255,255,.25);font-family:"Yu Mincho",serif;pointer-events:none}
.mbtn small{display:block;font-size:9px;margin-top:3px;font-family:"Segoe UI",sans-serif;opacity:.85}
#menu.open .mbtn{opacity:1;transform:scale(1);pointer-events:auto}
.mbtn:hover{background:#c8452f}
</style></head>
<body>
<div id="stage"><canvas id="c" width="460" height="460"></canvas>
<div id="bubble"><b>白雲 · SENSEI</b><span id="btxt"></span><div class="bar" id="bar"><i id="barI"></i></div></div>
<div id="ring"></div>
<div id="menu">
  <div class="mbtn" data-a="talk">話<small>Talk</small></div>
  <div class="mbtn" data-a="garden">庭<small>Garden</small></div>
  <div class="mbtn" data-a="palette">遊<small>Launch</small></div>
  <div class="mbtn" data-a="mode">休<small id="modeLbl">Rest</small></div>
  <div class="mbtn" data-a="settings">設<small>Settings</small></div>
  <div class="mbtn" data-a="friend">友<small>Friend</small></div>
</div>
</div>
<script src="brain-client.js"></script>
<script type="module" src="overlay.js"></script>
</body></html>
